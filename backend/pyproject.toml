[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isro-rag-framework"
version = "0.1.0"
description = "ISRO Secure On-Premise RAG Framework — fully offline retrieval-augmented generation"
requires-python = ">=3.11"
license = {text = "Internal Use Only"}

dependencies = [
    # ── Web Framework ────────────────────────────────────────
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",

    # ── OpenSearch (BM25 Lexical Index) ──────────────────────
    "opensearch-py>=2.4.0,<3.0.0",

    # ── Qdrant (Semantic Vector DB) ──────────────────────────
    "qdrant-client>=1.7.0,<2.0.0",

    # ── Neo4j (Knowledge Graph) ──────────────────────────────
    "neo4j>=5.15.0,<6.0.0",

    # ── Security & Auth ──────────────────────────────────────
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "cryptography>=42.0.0,<43.0.0",

    # ── Structured Logging ───────────────────────────────────
    "structlog>=24.1.0,<25.0.0",

    # ── Utilities ────────────────────────────────────────────
    "httpx>=0.27.0,<1.0.0",
    "tenacity>=8.2.0,<9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "mypy>=1.8.0,<2.0.0",
    "ruff>=0.2.0,<1.0.0",
    "pre-commit>=3.6.0,<4.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4", "PT", "RUF"]
ignore = ["S101"]  # Allow assert in tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
