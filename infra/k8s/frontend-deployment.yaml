apiVersion: apps/v1
kind: Deployment
metadata:
  name: isro-rag-frontend
  namespace: isro-rag
  labels:
    app: isro-rag-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: isro-rag-frontend
  template:
    metadata:
      labels:
        app: isro-rag-frontend
        component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: isro-rag-frontend:latest
          imagePullPolicy: Never  # Air-gapped — images pre-loaded
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "http://isro-rag-backend:8000/api/v1"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: isro-rag-frontend
  namespace: isro-rag
spec:
  selector:
    app: isro-rag-frontend
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP  # Expose via internal ingress only
